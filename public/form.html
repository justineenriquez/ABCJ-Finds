<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a restaurant · ABCJ Finds</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="form" style="background:var(--cream)">
  <div id="site-header"></div>

  <main class="form-wrap">
    <div class="crumbs"><a href="restaurants.html">Restaurants</a> &nbsp;|&nbsp; Add new record</div>
    <div class="title-row">
      <div><h1>Add a restaurant</h1><small style="color:var(--muted);font-size:12px"></small></div>
    </div>

    <form class="card form-card" id="add-form" novalidate>
      <div class="form-sec">
        <div class="sec-title"><div class="ico">1</div><div><h3>Restaurant details</h3><small>Basic information that helps identify this restaurant.</small></div></div>
        <div id="fields"></div>
      </div>
      <div class="form-error" id="form-error"></div>
      <div class="form-foot">
        <a class="btn" href="restaurants.html">Cancel</a>
        <button class="btn primary" id="submit-btn" type="submit">Submit restaurant</button>
      </div>
    </form>
  </main>

  <div id="site-footer"></div>
  <script src="js/app.js"></script>
</body>
</html>
